name: Docker build

on:
  pull_request:
    paths:
      - 'Dockerfile'
      - 'docker-compose.yaml'
      - 'docker-entrypoint.sh'
      - 'composer.json'
      - 'composer.lock'

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
