version: '3.8'

services:
  paragrafy-app:
    build: .
    container_name: paragrafy_saas
    restart: always
    ports:
      - "5555:80"
    volumes:
      # Persistiert SQLite-Datenbank, config.php, Backups und .env.local auf dem Host.
      # Ohne dieses Volume gehen Datenbank & Zugangsdaten bei jedem Rebuild verloren!
      # Seit 2026-09: Container-Pfad liegt bewusst AUSSERHALB von /var/www/html (dem
      # Apache-Docroot) -- vorher waeren DB/config.php/.env bei fehlender vhost-Haertung
      # direkt ueber HTTP erreichbar gewesen. Der Host-Pfad ./data bleibt unveraendert,
      # bestehende Installationen muessen hier nichts umziehen.
      - ./data:/var/www/data
    environment:
      - PARAGRAFY_DATA_DIR=/var/www/data